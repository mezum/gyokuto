[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR APACHE-2.0"

[workspace.dependencies]
chumsky = { version = "0.13.0", features = ["pratt"] }
logos = "0.16.1"
rstest = "0.27.0"
thiserror = "2.0.20"
unicode-ident = "1.0.26"
